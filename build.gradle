plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = findProperty('rlVersion') ?: 'latest.release'

configurations {
	injectedClient {
		transitive = false
	}
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion
	injectedClient group: 'net.runelite', name: 'injected-client', version: runeLiteVersion
    implementation group: 'com.google.inject.extensions', name: 'guice-multibindings', version: '4.1.0', {
        exclude group: 'com.google.inject'
    }

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testImplementation "org.mockito:mockito-core:3.3.3"
	testImplementation "com.google.inject.extensions:guice-testlib:4.2.3"
    testImplementation 'junit:junit:4.13.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7'
    testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'raidtracker'
version = '1.6.4'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('test') {
	useJUnit()
	jvmArgs '-ea', '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

def patchedInjectedClient = layout.buildDirectory.file('injected-client-menu-index.jar')

// Mask NPC menu indexes on the released client. See PatchMenuIndex.
tasks.register('patchInjectedClient', JavaExec) {
	group = 'application'
	description = 'Mask NPC menu indexes in the released RuneLite client'
	dependsOn tasks.named('compileTestJava')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.raidtracker.PatchMenuIndex'
	doFirst {
		args configurations.injectedClient.singleFile.absolutePath, patchedInjectedClient.get().asFile.absolutePath
	}
	inputs.files(configurations.injectedClient)
	outputs.file(patchedInjectedClient)
}

// Developer client with this plugin loaded. Same shape as the RuneLite example plugin.
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Run RuneLite with Raid Data Tracker loaded'
	dependsOn tasks.named('patchInjectedClient')
	classpath = files(patchedInjectedClient) + sourceSets.test.runtimeClasspath.filter { file ->
		!file.name.startsWith('injected-client-')
	}
	mainClass = 'com.raidtracker.RunClientAndPlugin'
	jvmArgs '-ea', '--add-opens=java.base/java.lang=ALL-UNNAMED'
	args '--developer-mode', '--debug'
}
